<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchFlow Admin | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --main-blue: #5B91BC;
            --glass-white: rgba(255, 255, 255, 0.95); /* Menos transparencia para legibilidad */
            --glass-border: rgba(255, 255, 255, 0.3);
            --accent-orange: #e67e22;
        }

        body {
            background: radial-gradient(circle at top, #7aaad3 0%, var(--main-blue) 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        .glass-panel {
            background: var(--glass-white);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            padding: 1.5rem;
            margin-bottom: 2rem;
            color: #333; /* Texto oscuro sobre fondo blanco */
        }

        .section-title {
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: block;
        }

        /* Estilo de Tabla Mejorado */
        .table {
            color: #333 !important;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .table thead th {
            border: none;
            color: #666;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 10px;
            text-transform: uppercase;
        }

        .table tbody tr {
            background: #f8fbff;
            transition: all 0.2s;
        }

        .table tbody tr td {
            padding: 15px 10px;
            border: none;
        }

        .table tbody tr td:first-child { border-radius: 10px 0 0 10px; }
        .table tbody tr td:last-child { border-radius: 0 10px 10px 0; }

        .table tbody tr:hover {
            background: #edf4fa;
            transform: scale(1.01);
        }

        /* Botones */
        .btn-lunch {
            background: var(--main-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            padding: 8px 20px;
        }

        .btn-lunch:hover {
            background: var(--accent-orange);
            color: white;
        }

        .btn-action {
            border: none;
            background: none;
            padding: 5px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn-edit { color: var(--main-blue); }
        .btn-edit:hover { background: #e1ecf5; }
        .btn-delete { color: #e74c3c; }
        .btn-delete:hover { background: #fdeaea; }

        .price-tag {
            color: var(--main-blue);
            font-weight: 800;
        }

        .id-text {
            color: #999;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-black text-white">LUNCH<span style="opacity: 0.6;">FLOW</span></h1>
        <p class="small opacity-75">SISTEMA DE ADMINISTRACIÓN</p>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="glass-panel" style="background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3);">
                <h6 class="text-white mb-3"><i class="bi bi-upload me-2"></i>Importar Menú</h6>
                <form action="/api/platos/importar" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control bg-transparent text-white mb-3" style="border: 1px solid rgba(255,255,255,0.4);">
                    <button type="submit" class="btn btn-light w-100 fw-bold" style="color: var(--main-blue);">SUBIR EXCEL</button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="glass-panel d-flex align-items-center justify-content-center" style="background: rgba(255,255,255,0.15); color: white;">
                <a href="/api/pedidos/exportar-reporte" class="text-white text-decoration-none fw-bold">
                    <i class="bi bi-download me-2"></i>DESCARGAR LISTADO CATERING
                </a>
            </div>
        </div>
    </div>

    <span class="section-title">Gestión de Platos</span>
    <div class="glass-panel">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Plato</th>
                    <th>Precio</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaPlatos"></tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="section-title mb-0">Usuarios Registrados</span>
        <button class="btn btn-light btn-sm fw-bold" style="color: var(--main-blue); border-radius: 8px;" onclick="abrirModalNuevo()">+ AGREGAR</button>
    </div>
    <div class="glass-panel">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Legajo</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th class="text-end">Opciones</th>
                </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function cargarPlatos() {
        const resp = await fetch('/api/platos');
        const platos = await resp.json();
        const tbody = document.getElementById('tablaPlatos');
        tbody.innerHTML = '';
        platos.forEach(p => {
            const id = p.idPlato || p.id_plato || p.id;
            tbody.innerHTML += `
                <tr>
                    <td class="id-text">#${id}</td>
                    <td class="fw-bold">${p.nombrePlato}</td>
                    <td class="price-tag">$${p.precioPlato}</td>
                    <td class="text-end">
                        <button class="btn-action btn-delete" onclick="eliminarPlato(${id})"><i class="bi bi-trash-fill"></i></button>
                    </td>
                </tr>`;
        });
    }

    async function cargarUsuarios() {
        const res = await fetch('/api/usuarios');
        const usuarios = await res.json();
        const tbody = document.getElementById('tablaUsuarios');
        tbody.innerHTML = '';
        usuarios.forEach(u => {
            tbody.innerHTML += `
                <tr>
                    <td class="id-text">${u.legajoUser}</td>
                    <td class="fw-bold">${u.nombreUser}</td>
                    <td class="text-muted small">${u.mailUser || '---'}</td>
                    <td class="text-end">
                        <button class="btn-action btn-edit" onclick="editarUser('${u.legajoUser}', '${u.nombreUser}', '${u.mailUser || ''}')">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button class="btn-action btn-delete" onclick="eliminarUser('${u.legajoUser}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>`;
        });
    }

    // Inicialización
    window.onload = () => { cargarPlatos(); cargarUsuarios(); };
</script>
</body>
</html>
